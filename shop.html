<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ویترین فروشگاه</title>
<meta name="theme-color" content="#1B1023">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1023; --surface:#2A1633; --surface-2:#341B40;
    --gold:#E8A33D; --gold-soft:#F0C179; --rose:#E85D75;
    --cream:#FBF3E7; --cream-dim:#C9BBC7; --line:rgba(251,243,231,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Vazirmatn', sans-serif; background:var(--bg); color:var(--cream); min-height:100vh;}
  img{max-width:100%; display:block;}
  button, input, select{font-family:inherit;}

  /* ---------- shop header ---------- */
  .shop-header{
    padding:34px 20px 26px; text-align:center;
    background:linear-gradient(160deg, var(--surface-2), var(--bg));
    border-bottom:1px solid var(--line);
  }
  .shop-logo{
    width:66px; height:66px; border-radius:20px; margin:0 auto 12px;
    background:linear-gradient(135deg, var(--gold), var(--rose));
    display:flex; align-items:center; justify-content:center;
    font-size:26px; font-weight:800; color:var(--bg); overflow:hidden;
  }
  .shop-logo img{width:100%; height:100%; object-fit:cover;}
  .shop-header h1{font-size:21px; font-weight:800;}
  .shop-header .sub{color:var(--cream-dim); font-size:13px; margin-top:4px;}

  main{padding:18px 16px 60px; max-width:640px; margin:0 auto;}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    overflow:hidden; cursor:pointer;
  }
  .card .img{aspect-ratio:1/1; background:var(--surface-2);}
  .card .img img{width:100%; height:100%; object-fit:cover;}
  .card .body{padding:10px 12px 12px;}
  .card .name{font-size:13.5px; font-weight:700; line-height:1.4; margin-bottom:4px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card .price{font-size:13px; font-weight:800; color:var(--gold-soft);}
  .card.out .img{opacity:0.4;}
  .out-badge{
    position:absolute; margin-top:8px; margin-right:8px;
    background:rgba(0,0,0,0.6); color:var(--cream); font-size:11px;
    padding:3px 9px; border-radius:100px;
  }
  .card{position:relative;}

  .empty-state{text-align:center; padding:60px 20px; color:var(--cream-dim);}

  /* ---------- product detail modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100;
    display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.show{display:flex;}
  .sheet{
    width:100%; max-width:480px; background:var(--surface);
    border-radius:22px 22px 0 0; max-height:92vh; overflow-y:auto; position:relative;
  }
  .sheet .hero-img{width:100%; aspect-ratio:1/1; background:var(--surface-2);}
  .sheet .hero-img img{width:100%; height:100%; object-fit:cover;}
  .sheet-body{padding:20px;}
  .sheet-body h2{font-size:19px; font-weight:800; margin-bottom:6px;}
  .sheet-body .price{font-size:17px; font-weight:800; color:var(--gold-soft); margin-bottom:14px;}
  .sheet-body .desc{font-size:14px; color:var(--cream-dim); line-height:1.8; margin-bottom:18px;}
  .close-x{
    position:absolute; top:12px; left:12px; width:34px; height:34px; border-radius:50%;
    background:rgba(0,0,0,0.5); border:none; color:var(--cream); font-size:16px; cursor:pointer; z-index:2;
  }

  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; color:var(--cream-dim); margin-bottom:5px;}
  .field input{
    width:100%; padding:11px 13px; border-radius:11px; background:var(--surface-2);
    border:1px solid var(--line); color:var(--cream); font-size:14px;
  }
  .field input:focus{outline:none; border-color:var(--gold);}
  .qty-row{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
  .qty-btn{width:36px; height:36px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line); color:var(--cream); font-size:16px; cursor:pointer;}
  .qty-val{font-weight:800; font-size:16px; min-width:24px; text-align:center;}

  .btn-order{
    width:100%; padding:14px; border-radius:100px; border:none;
    background:linear-gradient(135deg, var(--rose), #d1435c); color:var(--cream);
    font-weight:700; font-size:15px; cursor:pointer;
  }
  .btn-order:disabled{opacity:0.5; cursor:not-allowed;}

  .variant-group{margin-bottom:16px;}
  .variant-group label{display:block; font-size:12.5px; color:var(--cream-dim); margin-bottom:8px;}
  .variant-chips{display:flex; flex-wrap:wrap; gap:8px;}
  .v-chip{
    padding:9px 16px; border-radius:100px; background:var(--surface-2);
    border:1px solid var(--line); color:var(--cream); font-size:13.5px; cursor:pointer;
  }
  .v-chip.selected{background:var(--gold-soft); color:var(--bg); border-color:var(--gold-soft); font-weight:700;}
  .v-chip.disabled{opacity:0.35; text-decoration:line-through; cursor:not-allowed;}
  .form-msg{
    font-size:13px; padding:10px 12px; border-radius:10px; margin-bottom:12px;
    background:rgba(232,93,93,0.12); color:#f0a3a3; display:none;
  }
  .form-msg.show{display:block;}
  .form-msg.ok{background:rgba(93,190,122,0.12); color:#a3e0b5;}

  footer{text-align:center; padding:24px 16px; color:var(--cream-dim); font-size:12px;}
  footer a{color:var(--gold-soft); text-decoration:none;}
</style>
</head>
<body>

<div class="shop-header">
  <div class="shop-logo" id="shopLogo">؟</div>
  <h1 id="shopName">در حال بارگذاری…</h1>
  <div class="sub" id="shopSub"></div>
</div>

<main>
  <div class="grid" id="productGrid"></div>
</main>

<div class="overlay" id="detailOverlay">
  <div class="sheet">
    <button class="close-x" id="closeSheet">✕</button>
    <div class="hero-img" id="sheetImg"></div>
    <div class="sheet-body">
      <h2 id="sheetName"></h2>
      <div class="price" id="sheetPrice"></div>
      <div class="desc" id="sheetDesc"></div>
      <div class="variant-group" id="variantGroup" style="display:none;">
        <label>انتخاب کن</label>
        <div class="variant-chips" id="variantChips"></div>
      </div>

      <div class="form-msg" id="orderMsg"></div>
      <div class="qty-row">
        <button class="qty-btn" id="qtyMinus">−</button>
        <span class="qty-val" id="qtyVal">1</span>
        <button class="qty-btn" id="qtyPlus">+</button>
      </div>
      <div class="field"><label>نامت</label><input type="text" id="buyerName" required></div>
      <div class="field"><label>شماره تماس</label><input type="tel" id="buyerPhone" required placeholder="09xxxxxxxxx"></div>
      <button class="btn-order" id="submitOrder">ثبت سفارش</button>
    </div>
  </div>
</div>

<footer>ساخته‌شده با <a href="/">ویترین</a></footer>

<script>
const API = ""; // same-origin backend
const username = location.pathname.split("/").filter(Boolean).pop() || new URLSearchParams(location.search).get("shop");

let shopData = null, currentProduct = null, qty = 1, selectedVariant = null;

function toman(n){ return Number(n).toLocaleString("fa-IR") + " تومان"; }

function variantLabel(v) {
  return v.size && v.color ? `${v.size} / ${v.color}` : (v.size || v.color || "");
}

function currentAvailableStock() {
  if (selectedVariant) return selectedVariant.stock;
  return currentProduct.stock;
}

async function loadShop() {
  try {
    const res = await fetch(`${API}/api/shop/${username}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "فروشگاه پیدا نشد");
    shopData = data;
    renderShop();
  } catch (e) {
    document.getElementById("shopName").textContent = "فروشگاه پیدا نشد";
    document.getElementById("shopSub").textContent = e.message;
  }
}

function renderShop() {
  const { shop, products } = shopData;
  document.getElementById("shopName").textContent = shop.shop_name;
  document.getElementById("shopSub").textContent = `${products.length} محصول`;
  const logo = document.getElementById("shopLogo");
  if (shop.logo_url) {
    logo.innerHTML = `<img src="${shop.logo_url}">`;
  } else {
    logo.textContent = shop.shop_name?.[0] || "؟";
  }

  const grid = document.getElementById("productGrid");
  if (!products.length) {
    grid.innerHTML = '';
    document.querySelector("main").innerHTML = '<div class="empty-state">هنوز محصولی در این فروشگاه نیست</div>';
    return;
  }
  grid.innerHTML = products.map(p => `
    <div class="card ${p.status === 'out_of_stock' ? 'out' : ''}" onclick='openProduct(${p.id})'>
      ${p.status === 'out_of_stock' ? '<span class="out-badge">ناموجود</span>' : ''}
      <div class="img">${p.image_url ? `<img src="${p.image_url}">` : ''}</div>
      <div class="body">
        <div class="name">${p.name}</div>
        <div class="price">${toman(p.price)}</div>
      </div>
    </div>
  `).join("");
}

function openProduct(id) {
  currentProduct = shopData.products.find(p => p.id === id);
  if (!currentProduct) return;
  qty = 1;
  selectedVariant = null;
  document.getElementById("qtyVal").textContent = qty;
  document.getElementById("sheetImg").innerHTML = currentProduct.image_url ? `<img src="${currentProduct.image_url}">` : '';
  document.getElementById("sheetName").textContent = currentProduct.name;
  document.getElementById("sheetPrice").textContent = toman(currentProduct.price);
  document.getElementById("sheetDesc").textContent = currentProduct.description || '';
  document.getElementById("orderMsg").classList.remove("show");
  document.getElementById("buyerName").value = '';
  document.getElementById("buyerPhone").value = '';

  const variants = currentProduct.variants
    ? (typeof currentProduct.variants === "string" ? JSON.parse(currentProduct.variants) : currentProduct.variants)
    : null;
  const group = document.getElementById("variantGroup");
  const chipsEl = document.getElementById("variantChips");
  const submitBtn = document.getElementById("submitOrder");

  if (Array.isArray(variants) && variants.length) {
    group.style.display = "block";
    chipsEl.innerHTML = variants.map((v, i) => `
      <div class="v-chip ${v.stock <= 0 ? 'disabled' : ''}" data-index="${i}">${variantLabel(v)}</div>
    `).join("");
    chipsEl.querySelectorAll(".v-chip").forEach(chip => {
      chip.onclick = () => {
        if (chip.classList.contains("disabled")) return;
        chipsEl.querySelectorAll(".v-chip").forEach(c => c.classList.remove("selected"));
        chip.classList.add("selected");
        selectedVariant = variants[Number(chip.dataset.index)];
        qty = 1;
        document.getElementById("qtyVal").textContent = qty;
        submitBtn.disabled = false;
        submitBtn.textContent = "ثبت سفارش";
      };
    });
    submitBtn.disabled = true;
    submitBtn.textContent = "اول یک گزینه را انتخاب کن";
  } else {
    group.style.display = "none";
    submitBtn.disabled = currentProduct.status === 'out_of_stock';
    submitBtn.textContent = currentProduct.status === 'out_of_stock' ? 'ناموجود' : 'ثبت سفارش';
  }

  document.getElementById("detailOverlay").classList.add("show");
}
document.getElementById("closeSheet").onclick = () => document.getElementById("detailOverlay").classList.remove("show");

document.getElementById("qtyMinus").onclick = () => { if (qty > 1) qty--; document.getElementById("qtyVal").textContent = qty; };
document.getElementById("qtyPlus").onclick = () => {
  if (qty < currentAvailableStock()) qty++;
  document.getElementById("qtyVal").textContent = qty;
};

document.getElementById("submitOrder").onclick = async () => {
  const name = document.getElementById("buyerName").value.trim();
  const phone = document.getElementById("buyerPhone").value.trim();
  const msg = document.getElementById("orderMsg");
  msg.classList.remove("show", "ok");
  if (!name || !phone) { msg.textContent = "نام و شماره تماس را وارد کن"; msg.classList.add("show"); return; }

  try {
    const res = await fetch(`${API}/api/orders`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        product_id: currentProduct.id,
        quantity: qty,
        variant: selectedVariant ? variantLabel(selectedVariant) : null,
        buyer_name: name,
        buyer_phone: phone,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "خطا در ثبت سفارش");
    msg.textContent = "سفارش با موفقیت ثبت شد ✓ فروشنده به‌زودی با شما تماس می‌گیرد";
    msg.classList.add("show", "ok");
    document.getElementById("submitOrder").disabled = true;
    // refresh local stock view
    if (selectedVariant) selectedVariant.stock -= qty;
    else currentProduct.stock -= qty;
  } catch (e) {
    msg.textContent = e.message; msg.classList.add("show");
  }
};

loadShop();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
